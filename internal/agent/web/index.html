<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevNAT — local inspector</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111113;
    --border: #1f1f23;
    --text: #ededed;
    --muted: #8a8a92;
    --accent: #3b82f6;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(34,197,94,.15); }
  .target { color: var(--muted); font-size: 13px; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .stats { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; min-width: 120px; }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: none; }
  .stat .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  td.path { white-space: normal; word-break: break-all; color: var(--text); }
  .method { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }
  .badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); }
  .s2 { color: var(--green); border-color: rgba(34,197,94,.3); }
  .s3 { color: var(--accent); border-color: rgba(59,130,246,.3); }
  .s4 { color: var(--amber); border-color: rgba(245,158,11,.3); }
  .s5 { color: var(--red); border-color: rgba(239,68,68,.3); }
  .muted { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span> DevNAT</div>
    <div class="target" id="target"></div>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><div class="label">Requests</div><div class="value" id="total">0</div></div>
      <div class="stat"><div class="label">Errors (4xx/5xx)</div><div class="value" id="errors">0</div></div>
      <div class="stat"><div class="label">Avg latency</div><div class="value" id="avg">—</div></div>
    </div>
    <table>
      <thead>
        <tr><th style="width:90px">Time</th><th style="width:70px">Method</th><th>Path</th><th style="width:80px">Status</th><th style="width:90px">Latency</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">No requests yet — open your public URL to see traffic here.</div>
  </main>

<script>
function cls(s){ return s>=500?'s5':s>=400?'s4':s>=300?'s3':'s2'; }
function fmtTime(t){ const d=new Date(t); return d.toLocaleTimeString(); }

async function meta(){
  try { const r=await fetch('/api/meta'); const m=await r.json(); document.getElementById('target').textContent='→ '+m.local; } catch(e){}
}

async function tick(){
  let data=[];
  try { const r=await fetch('/api/requests'); data=await r.json()||[]; } catch(e){ return; }
  const rows=document.getElementById('rows');
  const empty=document.getElementById('empty');
  empty.style.display = data.length ? 'none' : 'block';

  document.getElementById('total').textContent=data.length;
  const errs=data.filter(d=>d.status>=400).length;
  document.getElementById('errors').textContent=errs;
  const avg=data.length? Math.round(data.reduce((a,d)=>a+d.durationMs,0)/data.length) : null;
  document.getElementById('avg').textContent = avg===null?'—':avg+' ms';

  rows.innerHTML = data.map(d=>`
    <tr>
      <td class="muted">${fmtTime(d.time)}</td>
      <td class="method">${d.method}</td>
      <td class="path">${d.path.replace(/</g,'&lt;')}</td>
      <td><span class="badge ${cls(d.status)}">${d.status}</span></td>
      <td class="muted">${d.durationMs} ms</td>
    </tr>`).join('');
}

meta();
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
