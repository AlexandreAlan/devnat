services:
  relay:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: devnat-relay:latest
    restart: unless-stopped
    # Host networking is the simplest way to bind :443 and let the on-demand
    # TLS-ALPN-01 challenge work. Run on a host/IP dedicated to the relay.
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    environment:
      DEVNAT_ADDR: ":443"
      DEVNAT_DOMAIN: ${DEVNAT_DOMAIN:?set DEVNAT_DOMAIN in .env}
      DEVNAT_EMAIL: ${DEVNAT_EMAIL:?set DEVNAT_EMAIL in .env}
      DEVNAT_TOKEN: ${DEVNAT_TOKEN:-}
      DEVNAT_CERT_DIR: /data/certmagic
    volumes:
      - certs:/data/certmagic
    command: ["relay"]

volumes:
  certs:
