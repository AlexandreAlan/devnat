version: 2

project_name: devnat

before:
  hooks:
    - go mod tidy

builds:
  - id: devnat
    main: ./cmd/devnat
    binary: devnat
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/alexandrealan/devnat/internal/buildinfo.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  draft: false
